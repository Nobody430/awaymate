name: Skylog
options:
  bundleIdPrefix: com.nobody430
  deploymentTarget:
    iOS: "17.0"
targets:
  Skylog:
    type: application
    platform: iOS
    sources: [Skylog, Shared]
    dependencies:
      - target: SkylogWidgets
    entitlements:
      path: Skylog/Skylog.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nobody430.skylog]
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nobody430.skylog
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "CI com.nobody430.skylog"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Skylog/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Skylog
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.nobody430.skylog.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Flugdokument
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.email-message, public.plain-text, public.html]
  SkylogWidgets:
    type: app-extension
    platform: iOS
    sources: [SkylogWidgets, Shared]
    entitlements:
      path: SkylogWidgets/SkylogWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nobody430.skylog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nobody430.skylog.widgets
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "CI com.nobody430.skylog.widgets"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: SkylogWidgets/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Skylog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Skylog:
    build:
      targets:
        Skylog: all
    run:
      config: Debug
    archive:
      config: Release
