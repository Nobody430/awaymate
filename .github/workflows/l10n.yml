name: Export Awaymate strings

# Lets the compiler collect every localizable string of Awaymate (exact keys incl. format specifiers)
# and prints them to the log, so translations can be written without a Mac.
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Export
        working-directory: skylog
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          # Let the Swift compiler emit every localizable string with its exact runtime key (format specifiers included)
          xcodebuild build -project Skylog.xcodeproj -scheme Skylog -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            SWIFT_EMIT_LOC_STRINGS=YES CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tail -15
          python3 - <<'PY'
          import glob, json, base64, re
          out = {}
          for path in glob.glob("dd/**/*.stringsdata", recursive=True):
              target = "SkylogWidgets" if "SkylogWidgets.build" in path else "Skylog"
              try:
                  data = json.load(open(path))
              except Exception as e:
                  print("SKIP", path, e); continue
              for table, entries in (data.get("tables") or {}).items():
                  for e in entries:
                      out.setdefault(target, {}).setdefault(table, set()).add(e.get("key", ""))
          res = {t: {tb: sorted(k) for tb, k in tabs.items()} for t, tabs in out.items()}
          for t, tabs in res.items():
              for tb, keys in tabs.items():
                  print("TABLE", t, tb, len(keys))
          data = base64.b64encode(json.dumps(res, ensure_ascii=False).encode()).decode()
          for i in range(0, len(data), 3000):
              print("L10N:" + data[i:i+3000])
          print("L10N-END")
          PY
